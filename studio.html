<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Studio | COAT Nail Studio</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<nav><a class="logo" href="/">COAT</a><a class="l" href="/services">services</a><a class="l" href="/gallery">gallery</a><a class="l" href="/about">about</a><a class="l" href="/policies">policies</a><a class="l" href="/find">find us</a><a class="btn f" href="/book">book</a></nav>
<section class="pg"><div class="wrap">
<div id="lg"><h1 class="ph rv">studio</h1><p class="note rv">For Rinad only.</p>
<form class="form rv" id="lf"><label>Password<input id="pw" type="password" autocomplete="current-password"></label><p class="msg" id="lm"></p><button class="btn f">Sign in</button></form></div>
<div id="dash" hidden><div style="display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap"><h1 class="ph">studio</h1><button class="btn" id="lo">sign out</button></div>
<div class="stats" id="stats"></div><div class="tabs" id="tabs"></div>
<input class="srch" id="sq" placeholder="Search name, phone or service" aria-label="Search bookings"><div id="bl"></div>
<div class="pn"><h3 style="font-size:1.6rem;margin-bottom:.6rem">reminders</h3><p class="note" style="margin:0 0 1rem">Rinad gets an email for every new request, and a morning email at 10:00 listing today’s and tomorrow’s confirmed appointments.</p><button class="btn" id="te">send a test email</button> <span class="note" id="tm"></span></div>
</div></div></section><footer><span>COAT Nail Studio</span><a href="/services">services</a><a href="/gallery">gallery</a><a href="/about">about</a><a href="/policies">policies</a><a href="/find">find us</a><a href="https://www.instagram.com/coatnailstudio_/" target="_blank" rel="noopener">@coatnailstudio_</a><a class="btn" href="/studio">studio login</a></footer><script src="/app.js"></script><script>
let tk=sessionStorage.getItem('ct'),B=[],flt='new',qq='',iv;
const api=async b=>{const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-token':tk||''},body:JSON.stringify(b)});if(r.status==401&&b.action!='login'){out();throw 0}return r.json()};
function out(){sessionStorage.removeItem('ct');tk=null;clearInterval(iv);$('#dash').hidden=true;$('#lg').hidden=false}
const od=()=>new Date(Date.now()+4*36e5).toISOString().slice(0,10);
const when=b=>new Date(b.d+'T'+b.t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+', '+b.t;
const wa=b=>{let n=(b.ph||'').replace(/\D/g,'');if(n.length==8)n='968'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(`Hi ${b.n}, it’s COAT Nail Studio. To confirm your ${when(b)} appointment, please send the 5 OMR deposit.`)};
async function load(){B=(await api({action:'list'})).bookings||[];rs()}
function rs(){const t=od(),up=B.filter(b=>b.status=='confirmed'&&b.d>=t),c=k=>B.filter(b=>b.status==k).length;
 $('#stats').innerHTML=`<div><b>${c('new')}</b>new requests</div><div><b>${up.length}</b>upcoming</div><div><b>${up.filter(b=>b.d==t).length}</b>today</div><div><b>${up.reduce((a,b)=>a+(+b.p||0),0)}</b>OMR booked</div>`;
 $('#tabs').innerHTML=['new','confirmed','today','all'].map(k=>`<button class="btn" data-k="${k}" aria-pressed="${flt==k}">${k}</button>`).join('');
 const L=B.filter(b=>flt=='all'||(flt=='today'?b.d==t&&b.status=='confirmed':b.status==flt)).filter(b=>(b.n+b.ph+b.s+(b.em||'')).toLowerCase().includes(qq)).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
 const A=(b,a,l)=>`<button class="btn" data-i="${esc(b.id)}" data-a="${a}">${l}</button>`;
 $('#bl').innerHTML=L.length?L.map(b=>`<article class="bk"><div><b>${esc(when(b))}</b><span class="st">${esc(b.status)}</span><small>${esc(b.s)}, ${esc(b.p)} OMR</small></div><div>${esc(b.n)}<small><a href="${wa(b)}" target="_blank" rel="noopener">${esc(b.ph)}</a>${b.nt?', '+esc(b.nt):''}</small>${b.em?`<small><a href="mailto:${esc(b.em)}">${esc(b.em)}</a></small>`:''}</div><div class="acts">${b.status=='new'?A(b,'confirmed','confirm'):''}${b.status=='confirmed'?A(b,'done','done'):''}${b.status=='cancelled'||b.status=='done'?'':A(b,'cancelled','cancel')}${A(b,'remove','remove')}</div></article>`).join(''):'<p class="note">Nothing here yet. New requests appear as soon as someone books.</p>';
 document.title=(c('new')?'('+c('new')+') ':'')+'Studio | COAT Nail Studio'}
$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){flt=k;rs()}};
$('#sq').oninput=e=>{qq=e.target.value.toLowerCase();rs()};
$('#bl').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a=='remove'&&!confirm('Remove this booking for good?'))return;
 b.disabled=true;await api(a=='remove'?{action:'remove',id:b.dataset.i}:{action:'status',id:b.dataset.i,status:a});load()};
$('#te').onclick=async()=>{$('#tm').textContent='Sending…';const j=await api({action:'test'});$('#tm').textContent=j.ok?'Test email sent to Rinad.':(j.e||'Couldn’t send.')};
$('#lo').onclick=out;
function start(){$('#lg').hidden=true;$('#dash').hidden=false;load();iv=setInterval(load,30000)}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lm').textContent='';const j=await api({action:'login',password:$('#pw').value});if(j.token){tk=j.token;sessionStorage.setItem('ct',tk);start()}else $('#lm').textContent='Wrong password.'};
if(tk)start();
</script></body></html>
