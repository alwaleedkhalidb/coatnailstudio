<section class="pg"><div class="wrap"><h1 class="ph rv">services</h1>
<p class="note rv">Choose your nails, then the finish. The price appears once you pick.</p>
<h3 class="rv" style="margin-top:3.5rem;font-size:1.6rem">what are we working with?</h3><div class="pks" id="ty"></div>

<div id="res" class="rv" hidden></div></div></section><footer><span>COAT Nail Studio</span><a href="/services">services</a><a href="/gallery">gallery</a><a href="/about">about</a><a href="/policies">policies</a><a href="/find">find us</a><a href="https://www.instagram.com/coatnailstudio_/" target="_blank" rel="noopener">@coatnailstudio_</a><a class="btn" href="/studio">studio login</a></footer><script src="/app.js"></script><script>
let gi=0;
const fade=(el,h)=>{el.style.setProperty('--p',0);el.hidden=false;if(h!=null)el.innerHTML=h;void el.offsetWidth;flow()};
$('#ty').innerHTML=G.map(([g],i)=>`<button class="pk rv" style="--d:${i*.1}s" data-i="${i}" aria-pressed="false">${g}</button>`).join('');
$('#ty').onclick=e=>{const b=e.target.closest('.pk');if(!b)return;gi=+b.dataset.i;[...$('#ty').children].forEach(x=>x.setAttribute('aria-pressed',x==b));
 $('#res').hidden=true;$('#res').classList.remove('in');
 $('#op').innerHTML=G[gi][1].map(([n],i)=>`<button class="pk rv" style="--d:${i*.1}s" data-i="${i}" aria-pressed="false">${n}</button>`).join('');
 $('#s2').hidden=false;void $('#op').offsetWidth;flow();
 setTimeout(()=>$('#s2').scrollIntoView({behavior:'smooth',block:'center'}),200)};
$('#op').onclick=e=>{const b=e.target.closest('.pk');if(!b)return;const[n,p]=G[gi][1][+b.dataset.i];[...$('#op').children].forEach(x=>x.setAttribute('aria-pressed',x==b));
 fade($('#res'),`<div class="big">${p}<small> OMR</small></div><p class="sum">${G[gi][0]}, ${n}</p><p class="note">A 5 OMR deposit confirms your time and goes toward the price.</p><a class="btn f" href="/book?s=${encodeURIComponent(G[gi][0]+' / '+n)}">book this</a>`);
 setTimeout(()=>$('#res').scrollIntoView({behavior:'smooth',block:'center'}),200)};
