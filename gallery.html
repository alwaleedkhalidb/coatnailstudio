ing="lazy"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 17"><span class="gi"><img src="/img/thumb-17.jpg" data-full="/img/work-17.jpg" data-tint="#b77345" alt="Deep red nails with 3D flowers and gold beads" loading="lazy"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 18"><span class="gi"><img src="/img/thumb-18.jpg" data-full="/img/work-18.jpg" data-tint="#be7448" alt="Pearly nails with starfish, shells and a peach sunset tip" loading="lazy"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 19"><span class="gi"><img src="/img/thumb-19.jpg" data-full="/img/work-19.jpg" data-tint="#b76c45" alt="Chocolate French tips with gold beads and a 3D lily" loading="lazy"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 20"><span class="gi"><img src="/img/thumb-20.jpg" data-full="/img/work-20.jpg" data-tint="#b76c45" alt="Tortoiseshell and chrome nails with a 3D lily and gold charm" loading="lazy"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 21"><span class="gi"><img src="/img/thumb-21.jpg" data-full="/img/work-21.jpg" data-tint="#d1844f" alt="Smoky grey and brown ombre nails with silver glitter" loading="lazy"><i class="gl"></i></span></button></div>

<footer><span>COAT Nail Studio</span><a href="/services">services</a><a href="/gallery">gallery</a><a href="/about">about</a><a href="/policies">policies</a><a href="/find">find us</a><a href="https://www.instagram.com/coatnailstudio_/" target="_blank" rel="noopener">@coatnailstudio_</a><a class="btn" href="/studio">studio login</a></footer><script src="/app.js"></script><script>
const TR=$('#gt'),cards=[...TR.children],n=cards.length,imgs=cards.map(c=>c.querySelector('img')),caps=['blue butterflies', 'spring garden', 'milky ombre', 'red bloom french', 'blueberry dots', 'butter & chrome', 'dotted hearts', 'pastel blooms', 'white lace', 'pink petals', 'swirl french', 'black bow', 'crimson bloom', 'sea glass', 'candy stripe', 'peach petals', 'ruby flowers','sea shells','cocoa lily','tortoise gold','smoke & silver'];
let cur=-1,dn=0,sx=0,sl=0,mv=0,li=0;

const LB=$('#lb'),LI=$('#lbi'),cu=$('#gcur');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sync(){$('#gc').textContent=pad(cur+1)+' / '+pad(n);$('#gcap').textContent=caps[cur];cards.forEach((c,i)=>c.classList.toggle('act',i==cur));const t=imgs[cur].dataset.tint;if(t)$('#gbg').style.setProperty('--tint',t)}
const VIS=3;
function upd(){const w=TR.clientWidth/2;let best=0,bd=1e9;
 const xs=cards.map(c=>(c.offsetLeft+c.offsetWidth/2-TR.scrollLeft-w)/c.offsetWidth);
 xs.forEach((x,i)=>{if(Math.abs(x)<bd){bd=Math.abs(x);best=i}});
 cards.forEach((c,i)=>{const x=xs[i];
  if(Math.abs(x)>VIS){if(c.style.visibility!=='hidden'){c.style.visibility='hidden';c.style.opacity=0}return}
  if(c.style.visibility==='hidden')c.style.visibility='visible';
  const a=clamp(x,-2.2,2.2);
  c.style.transform=`translateZ(${-Math.abs(a)*140}px) rotateY(${-a*34}deg) scale(${1-Math.abs(a)*.1})`;
  c.style.opacity=1-Math.min(1,Math.abs(a))*.45;c.style.zIndex=10-Math.round(Math.abs(a)*3);
  c.querySelector('img').style.transform=`translateX(${-a*9}%) scale(1.22)`;});
 if(best!==cur){cur=best;sync()}}
let want=-1,wantT=0;
let snapT=0;
const go=i=>{i=clamp(i,0,n-1);want=i;wantT=performance.now();const c=cards[i];
 TR.classList.add('nosnap');clearTimeout(snapT);snapT=setTimeout(()=>TR.classList.remove('nosnap'),800);
 TR.scrollTo({left:c.offsetLeft+c.offsetWidth/2-TR.clientWidth/2,behavior:'smooth'})};
const idxNow=()=>{const w=TR.clientWidth/2;let best=0,bd=1e9;cards.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-TR.scrollLeft-w);if(d<bd){bd=d;best=i}});return best};
// step from the pending target while clicks are still coming, otherwise from where we actually are
const step=d=>go(((performance.now()-wantT<500&&want>=0)?want:idxNow())+d);
let tick=0,settle=0;TR.addEventListener('scroll',()=>{clearTimeout(settle);settle=setTimeout(upd,110);if(tick)return;tick=1;requestAnimationFrame(()=>{tick=0;upd()})},{passive:true});addEventListener('resize',upd);addEventListener('load',upd);upd();
$('#gp').onclick=()=>step(-1);$('#gn2').onclick=()=>step(1);
TR.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;dn=1;mv=0;sx=e.clientX;sl=TR.scrollLeft;TR.classList.add('drag')});
addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)mv=1;TR.scrollLeft=sl-dx});
addEventListener('pointerup',()=>{if(!dn)return;dn=0;TR.classList.remove('drag');go(cur)});
TR.onclick=e=>{const c=e.target.closest('.gc');if(!c||mv)return;const i=cards.indexOf(c);i===cur?open(i):go(i)};
TR.addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;const c=e.target.closest('.gc');cu.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;cu.textContent=c&&c==cards[cur]?'open':'drag';cu.classList.add('on');
 cards.forEach(x=>{const g=x.firstElementChild;if(x===c&&x===cards[cur]){const r=g.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;g.style.setProperty('--ry',(px-.5)*16+'deg');g.style.setProperty('--rx',(.5-py)*16+'deg');g.style.setProperty('--mx',px*100+'%');g.style.setProperty('--my',py*100+'%')}else{g.style.setProperty('--rx','0deg');g.style.setProperty('--ry','0deg')}})});
TR.addEventListener('pointerleave',()=>{cu.classList.remove('on');cards.forEach(x=>{x.firstElementChild.style.setProperty('--rx','0deg');x.firstElementChild.style.setProperty('--ry','0deg')})});
const full=i=>imgs[i].dataset.full||imgs[i].src;
function show(i){li=(i+n)%n;LI.style.opacity=0;setTimeout(()=>{LI.src=full(li);LI.alt=imgs[li].alt;LI.style.opacity=1},160)}
function open(i){li=i;LI.src=full(i);LI.alt=imgs[i].alt;LB.hidden=false;void LB.offsetWidth;LB.classList.add('on')}
function close(){LB.classList.remove('on');go(li);setTimeout(()=>{LB.hidden=true},500)}
$('#lbx').onclick=close;$('#lbp').onclick=()=>show(li-1);$('#lbn').onclick=()=>show(li+1);
LB.onclick=e=>{if(e.target===LB)close()};
let s0=0;LB.addEventListener('pointerdown',e=>s0=e.clientX);LB.addEventListener('pointerup',e=>{const dx=e.clientX-s0;if(Math.abs(dx)>60)show(li+(dx<0?1:-1))});
addEventListener('keydown',e=>{if(!TR.offsetParent)return;const k=e.key;
 if(!LB.hidden){if(k=='Escape')close();if(k=='ArrowRight')show(li+1);if(k=='ArrowLeft')show(li-1)}else{if(k=='ArrowRight')go(cur+1);if(k=='ArrowLeft')go(cur-1)}});
</script></body></html>
