<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gallery | COAT Nail Studio</title><meta name="description" content="COAT Nail Studio. Gel, Gel X and extensions in Seeb, Oman."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<nav><a class="logo" href="/">COAT</a><a class="l" href="/services">services</a><a class="l" href="/gallery">gallery</a><a class="l" href="/about">about</a><a class="l" href="/policies">policies</a><a class="l" href="/find">find us</a><a class="btn f" href="/book">book</a></nav><section class="pg gx"><div class="wrap"><h1 class="ph rv">gallery</h1><p class="note rv">Drag, swipe or use the arrows. Tap the middle photo to open it.</p></div>
<div class="g3"><div class="gbg" id="gbg"></div><div class="gt" id="gt" tabindex="0" aria-label="Photo carousel"><button class="gc" aria-label="Open photo 1"><span class="gi"><img src="/img/work-1.jpg" alt="Stiletto nails painted like papaya halves with gold flowers"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 2"><span class="gi"><img src="/img/work-2.jpg" alt="Long stiletto nails with 3D flowers in pastel gradients"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 3"><span class="gi"><img src="/img/work-3.jpg" alt="Pale yellow nails with red blooms and silver studs"><i class="gl"></i></span></button><button class="gc" aria-label="Open photo 4"><span class="gi"><img src="/img/work-4.jpg" alt="Sheer pink nails with peach tips and 3D flowers"><i class="gl"></i></span></button></div>
<div class="gui"><button class="cn" id="gp" aria-label="Previous photo">‹</button><span class="gn" id="gc">01 / 04</span><button class="cn" id="gn2" aria-label="Next photo">›</button></div><p class="gcap" id="gcap"></p></div>
<div class="wrap"><p class="rv" style="margin-top:2.5rem"><a class="btn f" href="/book">book a set</a></p></div></section>
<div class="gcur" id="gcur">drag</div>
<div class="lb" id="lb" hidden><button class="cn lbx" id="lbx" aria-label="Close">×</button><button class="cn lbp" id="lbp" aria-label="Previous">‹</button><img id="lbi" alt=""><button class="cn lbn" id="lbn" aria-label="Next">›</button></div>
<footer><span>COAT Nail Studio</span><a href="/services">services</a><a href="/gallery">gallery</a><a href="/about">about</a><a href="/policies">policies</a><a href="/find">find us</a><a href="https://www.instagram.com/coatnailstudio_/" target="_blank" rel="noopener">@coatnailstudio_</a><a class="btn" href="/studio">studio login</a></footer><script src="/app.js"></script><script>
const TR=$('#gt'),cards=[...TR.children],n=cards.length,imgs=cards.map(c=>c.querySelector('img')),caps=['papaya & gold','pastel blooms','cherry chrome','peach petals'];
let cur=-1,dn=0,sx=0,sl=0,mv=0,li=0;
$('#gbg').innerHTML=imgs.map(i=>`<img src="${i.src}" alt="">`).join('');
const bgs=[...$('#gbg').children],LB=$('#lb'),LI=$('#lbi'),cu=$('#gcur');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sync(){$('#gc').textContent=pad(cur+1)+' / '+pad(n);$('#gcap').textContent=caps[cur];cards.forEach((c,i)=>c.classList.toggle('act',i==cur));bgs.forEach((b,i)=>b.classList.toggle('on',i==cur))}
function upd(){const w=TR.clientWidth/2;let best=0,bd=1e9;
 cards.forEach((c,i)=>{const x=(c.offsetLeft+c.offsetWidth/2-TR.scrollLeft-w)/c.offsetWidth,a=clamp(x,-2.2,2.2);
  c.style.transform=`translateZ(${-Math.abs(a)*140}px) rotateY(${-a*34}deg) scale(${1-Math.abs(a)*.1})`;
  c.style.opacity=1-Math.min(1,Math.abs(a))*.45;c.style.zIndex=10-Math.round(Math.abs(a)*3);
  c.querySelector('img').style.transform=`translateX(${-a*9}%) scale(1.22)`;
  if(Math.abs(x)<bd){bd=Math.abs(x);best=i}});
 if(best!==cur){cur=best;sync()}}
const go=i=>{i=clamp(i,0,n-1);const c=cards[i];TR.scrollTo({left:c.offsetLeft+c.offsetWidth/2-TR.clientWidth/2,behavior:'smooth'})};
TR.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});addEventListener('resize',upd);addEventListener('load',upd);upd();
$('#gp').onclick=()=>go(cur-1);$('#gn2').onclick=()=>go(cur+1);
TR.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;dn=1;mv=0;sx=e.clientX;sl=TR.scrollLeft;TR.classList.add('drag')});
addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)mv=1;TR.scrollLeft=sl-dx});
addEventListener('pointerup',()=>{if(!dn)return;dn=0;TR.classList.remove('drag');go(cur)});
TR.onclick=e=>{const c=e.target.closest('.gc');if(!c||mv)return;const i=cards.indexOf(c);i===cur?open(i):go(i)};
TR.addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;const c=e.target.closest('.gc');cu.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;cu.textContent=c&&c==cards[cur]?'open':'drag';cu.classList.add('on');
 cards.forEach(x=>{const g=x.firstElementChild;if(x===c&&x===cards[cur]){const r=g.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;g.style.setProperty('--ry',(px-.5)*16+'deg');g.style.setProperty('--rx',(.5-py)*16+'deg');g.style.setProperty('--mx',px*100+'%');g.style.setProperty('--my',py*100+'%')}else{g.style.setProperty('--rx','0deg');g.style.setProperty('--ry','0deg')}})});
TR.addEventListener('pointerleave',()=>{cu.classList.remove('on');cards.forEach(x=>{x.firstElementChild.style.setProperty('--rx','0deg');x.firstElementChild.style.setProperty('--ry','0deg')})});
function show(i){li=(i+n)%n;LI.style.opacity=0;setTimeout(()=>{LI.src=imgs[li].src;LI.alt=imgs[li].alt;LI.style.opacity=1},160)}
function open(i){li=i;LI.src=imgs[i].src;LI.alt=imgs[i].alt;LB.hidden=false;void LB.offsetWidth;LB.classList.add('on')}
function close(){LB.classList.remove('on');go(li);setTimeout(()=>{LB.hidden=true},500)}
$('#lbx').onclick=close;$('#lbp').onclick=()=>show(li-1);$('#lbn').onclick=()=>show(li+1);
LB.onclick=e=>{if(e.target===LB)close()};
let s0=0;LB.addEventListener('pointerdown',e=>s0=e.clientX);LB.addEventListener('pointerup',e=>{const dx=e.clientX-s0;if(Math.abs(dx)>60)show(li+(dx<0?1:-1))});
addEventListener('keydown',e=>{if(!TR.offsetParent)return;const k=e.key;
 if(!LB.hidden){if(k=='Escape')close();if(k=='ArrowRight')show(li+1);if(k=='ArrowLeft')show(li-1)}else{if(k=='ArrowRight')go(cur+1);if(k=='ArrowLeft')go(cur-1)}});
</script></body></html>
